name: Museum at Home CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Test ES5 runtime and catalog
        run: npm test

      - name: Validate content, rights and local fallbacks
        run: npm run validate

      - name: Build 1080p and 720p webOS apps
        run: npm run build

      - name: Install official webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Package IPK files
        run: |
          mkdir -p artifacts/1080 artifacts/720
          ares-package dist/webos-1080 -o artifacts/1080
          ares-package dist/webos-720 -o artifacts/720
          test "$(find artifacts -type f -name '*.ipk' | wc -l)" -eq 2

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: museum-at-home-webos
          path: artifacts/**/*.ipk
          if-no-files-found: error
          retention-days: 14

  universal-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test and build universal web assets
        run: |
          npm test
          npm run build:platforms:strict

      - name: Build Android TV and Fire TV APK
        working-directory: art-gallery-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package browser, Samsung and Android builds
        run: |
          mkdir -p artifacts
          (cd dist/web && zip -qr ../../artifacts/museum-at-home-web.zip .)
          (cd dist/tizen && zip -qr ../../artifacts/museum-at-home-tizen-unsigned.zip .)
          cp art-gallery-android/app/build/outputs/apk/debug/app-debug.apk artifacts/museum-at-home-android-tv-debug.apk
          test "$(find artifacts -type f | wc -l)" -eq 3

      - name: Upload cross-platform packages
        uses: actions/upload-artifact@v4
        with:
          name: museum-at-home-cross-platform
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
